<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, sans-serif">
  <!-- App Shell Canvas -->
  <rect width="960" height="600" fill="#f8fafc"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="190" height="600" fill="#0f172a"/>
  <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="700">ElectroApp</text>
  <text x="20" y="54" fill="#94a3b8" font-size="11">CRM-5 Portal &amp; Analytics</text>
  <text x="24" y="95" fill="#cbd5e1" font-size="12">Dashboard</text>
  <rect x="12" y="108" width="166" height="32" rx="6" fill="#2563eb"/>
  <text x="24" y="129" fill="#ffffff" font-size="12" font-weight="600">Customer Portal</text>
  <text x="24" y="160" fill="#cbd5e1" font-size="12">Reports</text>
  <text x="24" y="190" fill="#cbd5e1" font-size="12">Forecast</text>

  <!-- Top Bar -->
  <rect x="190" y="0" width="770" height="48" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="29" fill="#0f172a" font-size="13" font-weight="600">/crm5/portal/orders/SO-0001 — Order Fulfillment Tracker</text>

  <!-- Back link + Header -->
  <rect x="214" y="64" width="136" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="228" y="82" fill="#0f172a" font-size="11">&lt;- Back to Portal</text>
  <text x="214" y="120" fill="#0f172a" font-size="18" font-weight="700">Order Tracking: SO-0001</text>
  <rect x="444" y="103" width="84" height="22" rx="11" fill="#dbeafe"/>
  <text x="460" y="118" fill="#1d4ed8" font-size="11" font-weight="600">dispatched</text>

  <!-- 4-Step Fulfillment Stepper Card -->
  <rect x="214" y="140" width="722" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="234" y="166" fill="#0f172a" font-size="13" font-weight="600">Fulfillment Progress (4 Steps)</text>
  <!-- Connector lines -->
  <line x1="290" y1="210" x2="450" y2="210" stroke="#16a34a" stroke-width="4"/>
  <line x1="450" y1="210" x2="630" y2="210" stroke="#16a34a" stroke-width="4"/>
  <line x1="630" y1="210" x2="810" y2="210" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Step circles -->
  <circle cx="290" cy="210" r="18" fill="#16a34a"/>
  <text x="285" y="215" fill="#ffffff" font-size="12" font-weight="700">1</text>
  <text x="268" y="248" fill="#0f172a" font-size="12" font-weight="600">created</text>

  <circle cx="450" cy="210" r="18" fill="#16a34a"/>
  <text x="445" y="215" fill="#ffffff" font-size="12" font-weight="700">2</text>
  <text x="422" y="248" fill="#0f172a" font-size="12" font-weight="600">confirmed</text>

  <circle cx="630" cy="210" r="18" fill="#2563eb"/>
  <text x="625" y="215" fill="#ffffff" font-size="12" font-weight="700">3</text>
  <text x="598" y="248" fill="#1d4ed8" font-size="12" font-weight="700">dispatched</text>

  <circle cx="810" cy="210" r="18" fill="#e2e8f0"/>
  <text x="805" y="215" fill="#64748b" font-size="12" font-weight="700">4</text>
  <text x="784" y="248" fill="#64748b" font-size="12">delivered</text>

  <!-- Order & Warehouse Summary -->
  <rect x="214" y="298" width="722" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="234" y="324" fill="#0f172a" font-size="13" font-weight="600">Order &amp; Dispatch Summary</text>
  <text x="234" y="352" fill="#64748b" font-size="12">Customer ID: <tspan fill="#0f172a" font-weight="600">CUST-0001</tspan></text>
  <text x="470" y="352" fill="#64748b" font-size="12">Warehouse: <tspan fill="#0f172a" font-weight="600">WH-01</tspan></text>
  <text x="680" y="352" fill="#64748b" font-size="12">Order Date: <tspan fill="#0f172a" font-weight="600">2026-11-05</tspan></text>
  <text x="234" y="382" fill="#64748b" font-size="12">Subtotal: <tspan fill="#0f172a" font-weight="600">₹35,593.22</tspan></text>
  <text x="470" y="382" fill="#64748b" font-size="12">GST (18%): <tspan fill="#0f172a" font-weight="600">₹6,406.78</tspan></text>
  <text x="680" y="382" fill="#64748b" font-size="12">Grand Total: <tspan fill="#0f172a" font-weight="700">₹42,000.00</tspan></text>

  <!-- Line Items Table -->
  <rect x="214" y="424" width="722" height="148" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="234" y="450" fill="#0f172a" font-size="13" font-weight="600">Line Items</text>
  <rect x="234" y="462" width="682" height="24" fill="#f1f5f9"/>
  <text x="246" y="478" fill="#475569" font-size="11" font-weight="600">SKU</text>
  <text x="360" y="478" fill="#475569" font-size="11" font-weight="600">Item Description</text>
  <text x="580" y="478" fill="#475569" font-size="11" font-weight="600">Qty</text>
  <text x="670" y="478" fill="#475569" font-size="11" font-weight="600">Unit Price</text>
  <text x="800" y="478" fill="#475569" font-size="11" font-weight="600">Line Total</text>
  <text x="246" y="508" fill="#0f172a" font-size="11">SKU-0001</text>
  <text x="360" y="508" fill="#0f172a" font-size="11">Industrial Power Inverter 5kW</text>
  <text x="580" y="508" fill="#0f172a" font-size="11">2</text>
  <text x="670" y="508" fill="#0f172a" font-size="11">₹17,796.61</text>
  <text x="800" y="508" fill="#0f172a" font-size="11">₹35,593.22</text>
</svg>
