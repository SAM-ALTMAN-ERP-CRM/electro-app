<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, sans-serif">
  <!-- App Shell Canvas -->
  <rect width="960" height="600" fill="#f8fafc"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="190" height="600" fill="#0f172a"/>
  <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="700">ElectroApp</text>
  <text x="20" y="54" fill="#94a3b8" font-size="11">CRM-5 Portal &amp; Analytics</text>
  <text x="24" y="95" fill="#cbd5e1" font-size="12">Dashboard</text>
  <rect x="12" y="108" width="166" height="32" rx="6" fill="#2563eb"/>
  <text x="24" y="129" fill="#ffffff" font-size="12" font-weight="600">Customer Portal</text>
  <text x="24" y="160" fill="#cbd5e1" font-size="12">Reports</text>
  <text x="24" y="190" fill="#cbd5e1" font-size="12">Forecast</text>

  <!-- Top Bar -->
  <rect x="190" y="0" width="770" height="48" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="29" fill="#0f172a" font-size="13" font-weight="600">/crm5/portal — Customer Self-Service Portal</text>

  <!-- Customer Lookup Bar + Quick Demo Chips -->
  <text x="214" y="78" fill="#0f172a" font-size="18" font-weight="700">Customer Self-Service Portal</text>
  <rect x="214" y="90" width="722" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="230" y="114" fill="#64748b" font-size="11">Customer ID:</text>
  <rect x="308" y="99" width="150" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="115" fill="#0f172a" font-size="11">CUST-0001</text>
  <rect x="468" y="99" width="70" height="24" rx="4" fill="#2563eb"/>
  <text x="488" y="115" fill="#ffffff" font-size="11" font-weight="600">Load</text>
  <text x="230" y="138" fill="#64748b" font-size="10">Quick Demo Chips:</text>
  <rect x="330" y="127" width="72" height="16" rx="8" fill="#dbeafe"/>
  <text x="340" y="139" fill="#1d4ed8" font-size="9">CUST-0001</text>
  <rect x="410" y="127" width="72" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="420" y="139" fill="#475569" font-size="9">CUST-0002</text>
  <rect x="490" y="127" width="72" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="139" fill="#475569" font-size="9">CUST-0003</text>

  <!-- Profile Banner + Summary Cards -->
  <rect x="214" y="158" width="440" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="230" y="180" fill="#0f172a" font-size="13" font-weight="600">CUST-0001 — Acme Electronics Pvt. Ltd.</text>
  <text x="230" y="202" fill="#64748b" font-size="11">Orders: 2  |  Open Tickets: 1  |  Balance Due: ₹24,500.00</text>

  <!-- Raise a Ticket Form Card -->
  <rect x="668" y="158" width="268" height="132" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="684" y="180" fill="#0f172a" font-size="13" font-weight="600">Raise a Support Ticket</text>
  <rect x="684" y="190" width="236" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="692" y="206" fill="#94a3b8" font-size="10">Subject (e.g. Voltage drop SKU-0004)</text>
  <rect x="684" y="220" width="114" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="692" y="236" fill="#0f172a" font-size="10">Priority: high v</text>
  <rect x="684" y="252" width="236" height="26" rx="6" fill="#2563eb"/>
  <text x="760" y="269" fill="#ffffff" font-size="11" font-weight="600">Submit Ticket</text>

  <!-- My Orders Table -->
  <rect x="214" y="230" width="440" height="122" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="230" y="250" fill="#0f172a" font-size="13" font-weight="600">My Orders</text>
  <rect x="228" y="258" width="412" height="22" fill="#f1f5f9"/>
  <text x="238" y="273" fill="#475569" font-size="10" font-weight="600">Order ID</text>
  <text x="320" y="273" fill="#475569" font-size="10" font-weight="600">SKU</text>
  <text x="390" y="273" fill="#475569" font-size="10" font-weight="600">Status</text>
  <text x="480" y="273" fill="#475569" font-size="10" font-weight="600">Total (INR)</text>
  <text x="580" y="273" fill="#475569" font-size="10" font-weight="600">Action</text>
  <text x="238" y="298" fill="#0f172a" font-size="10">SO-0001</text>
  <text x="320" y="298" fill="#0f172a" font-size="10">SKU-0001</text>
  <rect x="388" y="286" width="66" height="16" rx="8" fill="#dbeafe"/>
  <text x="398" y="298" fill="#1d4ed8" font-size="9">dispatched</text>
  <text x="480" y="298" fill="#0f172a" font-size="10">₹42,000.00</text>
  <text x="580" y="298" fill="#2563eb" font-size="10" font-weight="600">Track -&gt;</text>
  <text x="238" y="324" fill="#0f172a" font-size="10">SO-0002</text>
  <text x="320" y="324" fill="#0f172a" font-size="10">SKU-0004</text>
  <rect x="388" y="312" width="66" height="16" rx="8" fill="#dcfce7"/>
  <text x="398" y="324" fill="#166534" font-size="9">delivered</text>
  <text x="480" y="324" fill="#0f172a" font-size="10">₹24,500.00</text>
  <text x="580" y="324" fill="#2563eb" font-size="10" font-weight="600">Track -&gt;</text>

  <!-- My Tickets Table -->
  <rect x="214" y="362" width="722" height="106" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="230" y="382" fill="#0f172a" font-size="13" font-weight="600">My Support Tickets</text>
  <rect x="228" y="390" width="694" height="22" fill="#f1f5f9"/>
  <text x="238" y="405" fill="#475569" font-size="10" font-weight="600">Ticket ID</text>
  <text x="330" y="405" fill="#475569" font-size="10" font-weight="600">Subject</text>
  <text x="560" y="405" fill="#475569" font-size="10" font-weight="600">Priority</text>
  <text x="680" y="405" fill="#475569" font-size="10" font-weight="600">Status</text>
  <text x="800" y="405" fill="#475569" font-size="10" font-weight="600">Created</text>
  <text x="238" y="432" fill="#0f172a" font-size="10">TCK-0001</text>
  <text x="330" y="432" fill="#0f172a" font-size="10">Calibration check for SKU-0001</text>
  <rect x="558" y="420" width="52" height="16" rx="8" fill="#fef3c7"/>
  <text x="568" y="432" fill="#92400e" font-size="9">amber</text>
  <rect x="678" y="420" width="52" height="16" rx="8" fill="#dbeafe"/>
  <text x="692" y="432" fill="#1d4ed8" font-size="9">open</text>
  <text x="800" y="432" fill="#0f172a" font-size="10">2026-11-08</text>

  <!-- My Invoices Table -->
  <rect x="214" y="478" width="722" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="230" y="498" fill="#0f172a" font-size="13" font-weight="600">My Invoices</text>
  <rect x="228" y="506" width="694" height="22" fill="#f1f5f9"/>
  <text x="238" y="521" fill="#475569" font-size="10" font-weight="600">Invoice ID</text>
  <text x="360" y="521" fill="#475569" font-size="10" font-weight="600">Due Date</text>
  <text x="510" y="521" fill="#475569" font-size="10" font-weight="600">Amount (INR + GST)</text>
  <text x="720" y="521" fill="#475569" font-size="10" font-weight="600">Status</text>
  <text x="238" y="548" fill="#0f172a" font-size="10">INV-0001</text>
  <text x="360" y="548" fill="#0f172a" font-size="10">2026-11-15</text>
  <text x="510" y="548" fill="#0f172a" font-size="10">₹24,500.00</text>
  <rect x="718" y="536" width="64" height="16" rx="8" fill="#fee2e2"/>
  <text x="730" y="548" fill="#b91c1c" font-size="9">overdue</text>
</svg>
