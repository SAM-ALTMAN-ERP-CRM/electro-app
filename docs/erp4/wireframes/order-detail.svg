<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .sidebar { fill: #0f172a; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .side-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      .side-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .side-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #475569; text-transform: uppercase; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .td-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #334155; }
      .btn-primary { fill: #2563eb; rx: 5px; }
      .btn-primary-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
      .badge-green { fill: #dcfce7; rx: 4px; }
      .badge-green-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #15803d; }
      .badge-blue { fill: #dbeafe; rx: 4px; }
      .badge-blue-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #1e40af; }
    </style>
  </defs>

  <rect width="1000" height="650" class="bg" />

  <!-- Global Sidebar Shell -->
  <rect x="0" y="0" width="220" height="650" class="sidebar" />
  <text x="20" y="35" class="side-title">⚡ ELECTRO APP</text>
  <text x="20" y="55" class="subtitle" style="fill: #64748b;">CRM + ERP Integrated Suite</text>
  <text x="20" y="100" class="subtitle" style="fill: #94a3b8; font-weight: 700;">ERP-4 ORDERS &amp; DISPATCH</text>
  <rect x="15" y="115" width="190" height="32" fill="#1e293b" rx="4" />
  <circle cx="28" cy="131" r="3" fill="#2563eb" />
  <text x="38" y="135" class="side-active">Sales Orders</text>
  <text x="38" y="165" class="side-item">Courier Dispatch</text>
  <text x="38" y="195" class="side-item">Return Receipts</text>

  <!-- Global Top Bar Shell -->
  <rect x="220" y="0" width="780" height="45" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="240" y="28" class="subtitle">Order Detail: <tspan font-weight="600" fill="#0f172a">SO-0006 (Global Electronics)</tspan></text>
  <rect x="880" y="12" width="100" height="22" class="badge-blue" />
  <text x="900" y="27" class="badge-blue-text">Role: admin</text>

  <!-- Main Content Area -->
  <g transform="translate(240, 60)">
    <!-- Back Navigation & Header -->
    <text x="0" y="15" class="subtitle" fill="#2563eb" font-weight="600">← Back to Orders</text>

    <text x="0" y="48" class="title">Sales Order SO-0006</text>
    <rect x="195" y="34" width="75" height="18" class="badge-green" />
    <text x="207" y="47" class="badge-green-text">confirmed</text>

    <!-- Context Buttons -->
    <rect x="620" y="30" width="120" height="30" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="5" />
    <text x="635" y="50" class="subtitle" font-weight="600" fill="#334155">Cancel Order</text>

    <!-- Metadata Cards -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="360" height="85" class="card" />
      <text x="15" y="22" class="th">CUSTOMER &amp; TAX IDENTIFICATION</text>
      <text x="15" y="45" class="td" font-weight="700">Global Electronics Pvt Ltd</text>
      <text x="15" y="62" class="subtitle">Customer ID: CUST-0006</text>
      <text x="15" y="76" class="subtitle">GSTIN: <tspan class="td-mono">27AABCG1234F1Z8</tspan></text>

      <rect x="380" y="0" width="360" height="85" class="card" />
      <text x="395" y="22" class="th">COMMERCIAL REFERENCES</text>
      <text x="395" y="45" class="td" font-weight="700">CRM-1 Accepted Quote: <tspan class="td-mono">QUO-0006</tspan></text>
      <text x="395" y="62" class="subtitle">Assigned Sales Rep: EMP-0002 (Rahul Sharma)</text>
      <text x="395" y="76" class="subtitle">Order Created: 2026-11-12 10:30 IST</text>
    </g>

    <!-- Line Items Table -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="740" height="170" class="card" />
      <rect x="1" y="1" width="738" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="15" y="20" class="th">#</text>
      <text x="45" y="20" class="th">SKU</text>
      <text x="160" y="20" class="th">PRODUCT DESCRIPTION</text>
      <text x="420" y="20" class="th">QTY</text>
      <text x="500" y="20" class="th">UNIT PRICE</text>
      <text x="630" y="20" class="th">AMOUNT (₹)</text>

      <line x1="0" y1="65" x2="740" y2="65" stroke="#f1f5f9" />
      <text x="15" y="52" class="subtitle">1</text>
      <text x="45" y="52" class="td-mono" font-weight="600">SKU-0001</text>
      <text x="160" y="52" class="td">55-inch 4K Smart TV</text>
      <text x="420" y="52" class="td">1</text>
      <text x="500" y="52" class="td">₹42,990.00</text>
      <text x="630" y="52" class="td" font-weight="600">₹42,990.00</text>

      <line x1="0" y1="100" x2="740" y2="100" stroke="#f1f5f9" />
      <text x="15" y="87" class="subtitle">2</text>
      <text x="45" y="87" class="td-mono" font-weight="600">SKU-0002</text>
      <text x="160" y="87" class="td">Wireless Home Theater Soundbar</text>
      <text x="420" y="87" class="td">2</text>
      <text x="500" y="87" class="td">₹16,000.00</text>
      <text x="630" y="87" class="td" font-weight="600">₹32,000.00</text>

      <!-- Financial Totals -->
      <line x1="0" y1="102" x2="740" y2="102" stroke="#cbd5e1" stroke-width="1" />
      <text x="450" y="125" class="subtitle">Subtotal: <tspan font-weight="600" fill="#0f172a">₹74,990.00</tspan></text>
      <text x="600" y="125" class="subtitle">CGST 9%: ₹6,749.10</text>
      <text x="450" y="148" class="subtitle">SGST 9%: ₹6,749.10</text>
      <text x="600" y="148" class="td" font-weight="700" fill="#15803d">Total: ₹88,488.20</text>
    </g>

    <!-- Inventory Reservation Panel (ERP4-B2) -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="740" height="170" class="card" />
      <text x="15" y="25" class="title" font-size="14px">Warehouse Inventory Reservations (WH-01)</text>
      <text x="15" y="42" class="subtitle">Live verification against ERP-1 central stock levels</text>

      <rect x="580" y="12" width="145" height="28" class="btn-primary" />
      <text x="595" y="30" class="btn-primary-text">⚡ Reserve Stock</text>

      <!-- Reservation Table Rows -->
      <rect x="15" y="60" width="710" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4" />
      <text x="30" y="85" class="td-mono" font-weight="700">SKU-0001</text>
      <text x="150" y="85" class="subtitle">Req: 1</text>
      <rect x="220" y="73" width="70" height="18" class="badge-green" />
      <text x="232" y="86" class="badge-green-text">reserved</text>
      <text x="320" y="85" class="subtitle" fill="#15803d">✓ In Stock (Allocated)</text>

      <line x1="15" y1="95" x2="725" y2="95" stroke="#e2e8f0" />
      <text x="30" y="112" class="td-mono" font-weight="700">SKU-0002</text>
      <text x="150" y="112" class="subtitle">Req: 2</text>
      <rect x="220" y="100" width="70" height="18" class="badge-green" />
      <text x="232" y="113" class="badge-green-text">reserved</text>
      <text x="320" y="112" class="subtitle" fill="#15803d">✓ In Stock (Allocated)</text>

      <!-- Success notification -->
      <rect x="15" y="130" width="710" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="4" />
      <text x="30" y="148" class="subtitle" font-weight="600" fill="#15803d">✓ All items fully reserved. This order is ready for courier dispatch.</text>
    </g>
  </g>
</svg>
