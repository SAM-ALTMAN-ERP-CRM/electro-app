<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">CRM-4 Customer Feedback Surveys Wireframe</title>
  <desc id="desc">Wireframe layout for /crm4/surveys (Surveys Directory &amp; Create Form)</desc>
  <rect width="960" height="620" fill="#f8fafc"/>
  <rect x="20" y="16" width="920" height="588" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Customer Feedback &amp; Surveys</text>
  <rect x="420" y="38" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="435" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-4</text>
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Collect structured customer feedback via NPS and CSAT rating surveys</text>
  <line x1="50" y1="96" x2="910" y2="96" stroke="#e2e8f0" stroke-width="1"/>

  <!-- KPI Metric Cards -->
  <rect x="50" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="65" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIVE SURVEYS</text>
  <text x="65" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2</text>

  <rect x="265" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="280" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TOTAL RESPONSES</text>
  <text x="280" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">20</text>

  <rect x="480" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="495" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">AVERAGE NPS SCORE</text>
  <text x="495" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#15803d">+45 (Good)</text>

  <rect x="695" y="108" width="215" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="710" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">AVERAGE CSAT</text>
  <text x="710" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2563eb">4.4 / 5.0</text>

  <!-- Filter & Action Controls -->
  <rect x="50" y="172" width="450" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">🔍 Search surveys by title or type...</text>

  <rect x="760" y="172" width="150" height="34" rx="6" fill="#2563eb"/>
  <text x="795" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ New Survey</text>

  <!-- Surveys Table Card -->
  <rect x="50" y="218" width="860" height="180" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Table Header -->
  <rect x="50" y="218" width="860" height="32" rx="6" fill="#f8fafc"/>
  <text x="65" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">ID</text>
  <text x="160" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">SURVEY TITLE</text>
  <text x="440" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">TYPE</text>
  <text x="560" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">RESPONSES</text>
  <text x="690" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">CREATED</text>
  <text x="800" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">ACTIONS</text>
  <line x1="50" y1="250" x2="910" y2="250" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="65" y="274" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">SRV-0001</text>
  <text x="160" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Annual Product Experience NPS</text>
  <rect x="440" y="261" width="50" height="18" rx="9" fill="#dbeafe"/>
  <text x="453" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">nps</text>
  <text x="560" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">10 responses</text>
  <text x="690" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">2026-10-10</text>
  <text x="800" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Respond</text>
  <text x="860" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">Results &gt;</text>
  <line x1="50" y1="288" x2="910" y2="288" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="65" y="312" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">SRV-0002</text>
  <text x="160" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Post-Delivery Installation CSAT</text>
  <rect x="440" y="299" width="50" height="18" rx="9" fill="#dcfce7"/>
  <text x="451" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803d">csat</text>
  <text x="560" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">10 responses</text>
  <text x="690" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">2026-10-18</text>
  <text x="800" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Respond</text>
  <text x="860" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">Results &gt;</text>
  <line x1="50" y1="326" x2="910" y2="326" stroke="#f1f5f9"/>

  <!-- Create Survey Form Card -->
  <rect x="50" y="405" width="860" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Create New Survey</text>

  <text x="70" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Survey Title *</text>
  <rect x="70" y="462" width="460" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">e.g. Q4 Dealer Experience Survey</text>

  <text x="550" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Survey Metric Type *</text>
  <rect x="550" y="462" width="340" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">NPS - Net Promoter Score (0-10 Scale) ▼</text>

  <rect x="70" y="510" width="150" height="32" rx="4" fill="#2563eb"/>
  <text x="98" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Create Survey</text>

  <!-- Explanatory note -->
  <text x="240" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">NPS calculates Promoters (9-10), Passives (7-8), Detractors (0-6) and computes %Promoters - %Detractors.</text>
</svg>
