<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">CRM-4 Target Audiences Wireframe</title>
  <desc id="desc">Wireframe layout for /crm4/audiences (Audiences Master Directory &amp; Create Form)</desc>
  <rect width="960" height="620" fill="#f8fafc"/>
  <rect x="20" y="16" width="920" height="588" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Target Audiences</text>
  <rect x="280" y="38" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="295" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-4</text>
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Manage curated customer lists, track reachable vs opted-out members &amp; import from CRM-3 segments</text>
  <line x1="50" y1="96" x2="910" y2="96" stroke="#e2e8f0" stroke-width="1"/>

  <!-- KPI Metrics -->
  <rect x="50" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="65" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TOTAL AUDIENCES</text>
  <text x="65" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3</text>

  <rect x="265" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="280" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TOTAL SUBSCRIBERS</text>
  <text x="280" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">24</text>

  <rect x="480" y="108" width="195" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="495" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">REACHABLE AUDIENCE</text>
  <text x="495" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#15803d">21 (87.5%)</text>

  <rect x="695" y="108" width="215" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="710" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">OPTED OUT</text>
  <text x="710" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#dc2626">3 (12.5%)</text>

  <!-- Search & Toolbar -->
  <rect x="50" y="172" width="450" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">🔍 Search audiences by name or description...</text>

  <rect x="760" y="172" width="150" height="34" rx="6" fill="#2563eb"/>
  <text x="790" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ New Audience</text>

  <!-- Audiences Table Card -->
  <rect x="50" y="218" width="860" height="180" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Table Header -->
  <rect x="50" y="218" width="860" height="32" rx="6" fill="#f8fafc"/>
  <text x="65" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">ID</text>
  <text x="160" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">AUDIENCE NAME</text>
  <text x="340" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">DESCRIPTION</text>
  <text x="560" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">MEMBERS</text>
  <text x="660" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">REACHABLE</text>
  <text x="770" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">CREATED</text>
  <text x="850" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">ACTION</text>
  <line x1="50" y1="250" x2="910" y2="250" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="65" y="274" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">AUD-0001</text>
  <text x="160" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Festive Shoppers</text>
  <text x="340" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">High-intent buyers for festive electronics sale</text>
  <text x="560" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">8</text>
  <rect x="660" y="261" width="75" height="18" rx="9" fill="#dcfce7"/>
  <text x="670" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803d">7 active</text>
  <text x="770" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">2026-10-15</text>
  <text x="850" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Manage &gt;</text>
  <line x1="50" y1="288" x2="910" y2="288" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="65" y="312" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">AUD-0002</text>
  <text x="160" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Corporate Accounts</text>
  <text x="340" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">B2B accounts targeted for monitor &amp; printer fleet</text>
  <text x="560" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">10</text>
  <rect x="660" y="299" width="75" height="18" rx="9" fill="#dcfce7"/>
  <text x="667" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#15803d">10 active</text>
  <text x="770" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">2026-10-20</text>
  <text x="850" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Manage &gt;</text>
  <line x1="50" y1="326" x2="910" y2="326" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="65" y="350" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">AUD-0003</text>
  <text x="160" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Warranty Care Leads</text>
  <text x="340" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Customers nearing warranty expiry for AMC plans</text>
  <text x="560" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">6</text>
  <rect x="660" y="337" width="75" height="18" rx="9" fill="#fef3c7"/>
  <text x="670" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#b45309">4 active</text>
  <text x="770" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">2026-11-01</text>
  <text x="850" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Manage &gt;</text>
  <line x1="50" y1="364" x2="910" y2="364" stroke="#f1f5f9"/>

  <!-- Create Audience Form Card -->
  <rect x="50" y="405" width="860" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Create New Target Audience</text>

  <text x="70" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Audience Name *</text>
  <rect x="70" y="462" width="340" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">e.g. VIP Retail Tier 1 Customers</text>

  <text x="430" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Description &amp; Objective *</text>
  <rect x="430" y="462" width="460" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">e.g. Loyal customers eligible for exclusive preview discounts</text>

  <rect x="70" y="510" width="160" height="32" rx="4" fill="#2563eb"/>
  <text x="96" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Create Audience</text>

  <!-- Segment Import Helper Note -->
  <rect x="250" y="506" width="640" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="265" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af">💡 Tip: Import Customers directly from CRM-3 Dynamic Segments</text>
  <text x="265" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">You can populate members automatically by clicking "Manage" on any audience and selecting a CRM-3 segment.</text>
</svg>
