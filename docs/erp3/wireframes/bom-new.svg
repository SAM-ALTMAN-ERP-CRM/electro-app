<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ERP-3 New BOM Creation Wireframe</title>
  <desc id="desc">Wireframe for /erp3/boms/new with dynamic component rows</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Create Bill of Materials</text>
  <rect x="330" y="48" width="70" height="22" rx="11" fill="#dbeafe"/>
  <text x="345" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">ERP-3</text>
  <text x="50" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Specify finished product metadata and dynamic raw material component requirements</text>

  <!-- Back button -->
  <rect x="790" y="46" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="810" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">← Back to List</text>

  <line x1="50" y1="110" x2="910" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Form Section 1: Header Meta -->
  <rect x="50" y="125" width="860" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Finished Product SKU</text>
  <rect x="70" y="160" width="220" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0001 (55" LED TV) ▼</text>

  <text x="320" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Product Display Name</text>
  <rect x="320" y="160" width="350" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="335" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">55" 4K Smart LED Television</text>

  <text x="700" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Version</text>
  <rect x="700" y="160" width="80" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="735" y="183" font-family="monospace" font-size="13" fill="#0f172a">1</text>

  <rect x="805" y="170" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="828" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Active</text>

  <!-- Form Section 2: Component Rows Table -->
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Component Recipe Rows</text>
  <rect x="50" y="255" width="860" height="230" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="255" width="860" height="35" rx="8" fill="#f8fafc"/>
  <text x="70" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">COMPONENT SKU</text>
  <text x="250" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">COMPONENT NAME</text>
  <text x="620" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">QTY PER UNIT</text>
  <text x="830" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTION</text>
  <line x1="50" y1="290" x2="910" y2="290" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="322" font-family="monospace" font-size="13" fill="#0f172a">SKU-0101 ▼</text>
  <text x="250" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">55" Display Panel Module</text>
  <rect x="620" y="305" width="90" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="655" y="324" font-family="monospace" font-size="13" fill="#0f172a">1.0</text>
  <text x="840" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="bold">✕</text>
  <line x1="50" y1="340" x2="910" y2="340" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="367" font-family="monospace" font-size="13" fill="#0f172a">SKU-0102 ▼</text>
  <text x="250" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Smart TV Mainboard</text>
  <rect x="620" y="350" width="90" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="655" y="369" font-family="monospace" font-size="13" fill="#0f172a">1.0</text>
  <text x="840" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="bold">✕</text>
  <line x1="50" y1="385" x2="910" y2="385" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="70" y="412" font-family="monospace" font-size="13" fill="#0f172a">SKU-0103 ▼</text>
  <text x="250" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">150W Power Supply Module</text>
  <rect x="620" y="395" width="90" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="655" y="414" font-family="monospace" font-size="13" fill="#0f172a">1.0</text>
  <text x="840" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="bold">✕</text>
  <line x1="50" y1="430" x2="910" y2="430" stroke="#f1f5f9"/>

  <!-- Add Row Button -->
  <rect x="70" y="445" width="160" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="85" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">+ Add Component Row</text>

  <!-- Submit / Cancel Bottom Controls -->
  <rect x="50" y="510" width="100" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="78" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">Cancel</text>

  <rect x="730" y="510" width="180" height="38" rx="6" fill="#2563eb"/>
  <text x="755" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Save &amp; Publish BOM</text>
</svg>
