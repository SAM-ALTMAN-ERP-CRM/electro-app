<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ERP-3 Bills of Materials List Wireframe</title>
  <desc id="desc">Wireframe for /erp3/boms listing BOM recipes</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Bills of Materials (BOM)</text>
  <rect x="330" y="48" width="70" height="22" rx="11" fill="#dbeafe"/>
  <text x="345" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">ERP-3</text>
  <text x="50" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Engineering product structures, component lists and yield requirements</text>

  <!-- Create Button -->
  <rect x="780" y="46" width="130" height="36" rx="6" fill="#2563eb"/>
  <text x="803" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Create BOM</text>

  <line x1="50" y1="110" x2="910" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Search & Filter Controls -->
  <rect x="50" y="125" width="300" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">🔍 Search by SKU or Name...</text>

  <rect x="365" y="125" width="180" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Filter: All Products ▼</text>

  <!-- Table Card -->
  <rect x="50" y="180" width="860" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Table Header -->
  <rect x="50" y="180" width="860" height="35" rx="8" fill="#f8fafc"/>
  <text x="70" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">BOM ID</text>
  <text x="180" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRODUCT SKU</text>
  <text x="310" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRODUCT NAME</text>
  <text x="560" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">VERSION</text>
  <text x="650" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>
  <text x="780" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIONS</text>
  <line x1="50" y1="215" x2="910" y2="215" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="248" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">BOM-0001</text>
  <text x="180" y="248" font-family="monospace" font-size="13" fill="#2563eb">SKU-0001</text>
  <text x="310" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">55" 4K Smart LED TV (5 Components)</text>
  <text x="560" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">v1</text>
  <rect x="650" y="234" width="65" height="20" rx="10" fill="#dcfce7"/>
  <text x="664" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">active</text>
  <text x="780" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="265" x2="910" y2="265" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="298" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">BOM-0002</text>
  <text x="180" y="298" font-family="monospace" font-size="13" fill="#2563eb">SKU-0003</text>
  <text x="310" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">65" OLED TV (5 Components)</text>
  <text x="560" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">v1</text>
  <rect x="650" y="284" width="65" height="20" rx="10" fill="#dcfce7"/>
  <text x="664" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">active</text>
  <text x="780" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="315" x2="910" y2="315" stroke="#f1f5f9"/>

  <!-- Informational Footnote -->
  <rect x="50" y="430" width="860" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Component Shared Contract (Section 5):</text>
  <text x="70" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Seed BOMs for SKU-0001 and SKU-0003 strictly utilize shared component SKUs: SKU-0101 (panel), SKU-0102 (mainboard),</text>
  <text x="70" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">SKU-0103 (power supply), SKU-0104 (remote control), and SKU-0105 (packaging box).</text>
</svg>
