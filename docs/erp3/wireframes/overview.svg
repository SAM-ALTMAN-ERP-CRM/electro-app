  <rect x="500" y="310" width="85" height="20" rx="10" fill="#fef3c7"/>
  <text x="512" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">in_progress</text>
  <text x="640" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">2026-11-15</text>
  <text x="790" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="340" x2="910" y2="340" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="370" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0002</text>
  <text x="180" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0003 (65" OLED TV)</text>
  <text x="400" y="370" font-family="monospace" font-size="13" fill="#0f172a">25</text>
  <rect x="500" y="355" width="85" height="20" rx="10" fill="#fef3c7"/>
  <text x="512" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">in_progress</text>
  <text x="640" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">2026-11-16</text>
  <text x="790" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="385" x2="910" y2="385" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="70" y="415" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0003</text>
  <text x="180" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0001 (55" 4K Smart TV)</text>
  <text x="400" y="415" font-family="monospace" font-size="13" fill="#0f172a">100</text>
  <rect x="500" y="400" width="70" height="20" rx="10" fill="#dbeafe"/>
  <text x="512" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">planned</text>
  <text x="640" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">2026-11-18</text>
  <text x="790" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">View Details &gt;</text>

  <!-- Quick Links Card -->
  <rect x="50" y="480" width="860" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Quick Production Links:</text>
  <text x="70" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb">👉 Browse Bills of Materials (BOM) &amp; Check Material Shortages</text>
  <text x="500" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb">👉 Run Quality Control Inspection &amp; View Pass Rates</text>
