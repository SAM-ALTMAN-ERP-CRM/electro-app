  <text x="70" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">2 Recipes</text>

  <!-- Card 2 -->
  <rect x="270" y="125" width="200" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
