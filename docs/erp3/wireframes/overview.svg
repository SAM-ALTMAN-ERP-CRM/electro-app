  <text x="290" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#2563eb">3 Orders</text>

  <!-- Card 3 -->
  <rect x="490" y="125" width="200" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
