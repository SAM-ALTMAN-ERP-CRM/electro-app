  <text x="180" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRODUCT SKU</text>
  <text x="400" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">QTY</text>
