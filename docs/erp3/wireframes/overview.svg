  <text x="730" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">QC PASS RATE</text>
  <text x="730" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#15803d">92.5%</text>

  <!-- Table Title -->
  <text x="50" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Active Floor Work Orders</text>

  <!-- Table Card -->
