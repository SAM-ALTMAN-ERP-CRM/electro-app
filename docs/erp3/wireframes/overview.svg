  <rect x="300" y="48" width="70" height="22" rx="11" fill="#dbeafe"/>
  <text x="315" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">ERP-3</text>
  <text x="50" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Assembly line work orders, BOM recipes &amp; quality inspection metrics</text>

  <!-- Action button -->
