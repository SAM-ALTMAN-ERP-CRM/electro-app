<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ERP-3 Quality Control &amp; Inspection Wireframe</title>
  <desc id="desc">Wireframe for /erp3/qc with summary KPIs, inspection form and logs</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Quality Control (QC) &amp; Inspection</text>
  <rect x="420" y="48" width="70" height="22" rx="11" fill="#dbeafe"/>
  <text x="435" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">ERP-3</text>
  <text x="50" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Batch quality validation, pass/fail/rework threshold calculation and defect analytics</text>

  <line x1="50" y1="110" x2="910" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- QC Summary Card (ERP3-D3) -->
  <rect x="50" y="125" width="860" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">OVERALL QC PASS RATE</text>
  <text x="70" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#15803d">92.5%</text>

  <!-- Pass rate bar -->
  <rect x="200" y="165" width="220" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="200" y="165" width="203" height="14" rx="7" fill="#16a34a"/>

  <!-- Defect breakdown -->
  <text x="480" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">DEFECT REASONS BREAKDOWN</text>
  <text x="480" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Scratch: 3 (50%)</text>
  <text x="480" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Dead Pixel: 2 (33%)</text>
  <text x="660" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">No Power: 1 (17%)</text>
  <text x="660" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Wrong Label: 0 (0%)</text>

  <!-- Record Inspection Form (ERP3-D2) -->
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Record Inspection Check (ERP3-D2)</text>
  <rect x="50" y="255" width="860" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="70" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">WORK ORDER</text>
  <rect x="70" y="285" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="305" font-family="monospace" font-size="12" fill="#0f172a">WO-0001 ▼</text>

  <text x="220" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">INSPECTOR</text>
  <rect x="220" y="285" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="230" y="305" font-family="monospace" font-size="12" fill="#0f172a">EMP-0005 ▼</text>

  <text x="370" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">CHECKED</text>
  <rect x="370" y="285" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="305" font-family="monospace" font-size="12" fill="#0f172a">50</text>

  <text x="460" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">PASSED</text>
  <rect x="460" y="285" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="305" font-family="monospace" font-size="12" fill="#16a34a">50</text>

  <text x="550" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">FAILED</text>
  <rect x="550" y="285" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="575" y="305" font-family="monospace" font-size="12" fill="#0f172a">0</text>

  <text x="640" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">DEFECT REASON</text>
  <rect x="640" y="285" width="120" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="650" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">None ▼</text>

  <!-- Submit Button -->
  <rect x="780" y="283" width="110" height="34" rx="6" fill="#2563eb"/>
  <text x="795" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Submit Check</text>

  <!-- QC Log Table -->
  <text x="50" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Quality Inspections Log</text>
  <rect x="50" y="390" width="860" height="165" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="390" width="860" height="32" rx="8" fill="#f8fafc"/>
  <text x="70" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">QC ID</text>
  <text x="180" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">WORK ORDER</text>
  <text x="310" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">INSPECTOR</text>
  <text x="440" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CHECKED / PASS / FAIL</text>
  <text x="640" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">DEFECT</text>
  <text x="780" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">RESULT</text>
  <line x1="50" y1="422" x2="910" y2="422" stroke="#e2e8f0"/>

  <!-- Row 1: pass -->
  <text x="70" y="447" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">QC-0001</text>
  <text x="180" y="447" font-family="monospace" font-size="13" fill="#2563eb">WO-0001</text>
  <text x="310" y="447" font-family="monospace" font-size="13" fill="#0f172a">EMP-0005</text>
  <text x="440" y="447" font-family="monospace" font-size="13" fill="#0f172a">50 / 50 / 0</text>
  <text x="640" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">—</text>
  <rect x="780" y="433" width="60" height="20" rx="10" fill="#dcfce7"/>
  <text x="793" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">pass</text>
  <line x1="50" y1="462" x2="910" y2="462" stroke="#f1f5f9"/>

  <!-- Row 2: rework -->
  <text x="70" y="487" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">QC-0002</text>
  <text x="180" y="487" font-family="monospace" font-size="13" fill="#2563eb">WO-0002</text>
  <text x="310" y="487" font-family="monospace" font-size="13" fill="#0f172a">EMP-0006</text>
  <text x="440" y="487" font-family="monospace" font-size="13" fill="#0f172a">25 / 23 / 2</text>
  <text x="640" y="487" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309">scratch</text>
  <rect x="780" y="473" width="65" height="20" rx="10" fill="#fef3c7"/>
  <text x="790" y="487" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">rework</text>
  <line x1="50" y1="502" x2="910" y2="502" stroke="#f1f5f9"/>

  <!-- Row 3: fail -->
  <text x="70" y="527" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">QC-0003</text>
  <text x="180" y="527" font-family="monospace" font-size="13" fill="#2563eb">WO-0003</text>
  <text x="310" y="527" font-family="monospace" font-size="13" fill="#0f172a">EMP-0005</text>
  <text x="440" y="527" font-family="monospace" font-size="13" fill="#0f172a">20 / 14 / 6</text>
  <text x="640" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626">no power</text>
  <rect x="780" y="513" width="60" height="20" rx="10" fill="#fee2e2"/>
  <text x="795" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">fail</text>
</svg>
