<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ERP-3 Work Orders Tracker Wireframe</title>
  <desc id="desc">Wireframe for /erp3/work-orders with status lifecycle transitions</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Work Orders Tracker</text>
  <rect x="310" y="48" width="70" height="22" rx="11" fill="#dbeafe"/>
  <text x="325" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">ERP-3</text>
  <text x="50" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Manufacturing floor work orders, assembly execution and status transitions</text>

  <!-- Create Button -->
  <rect x="750" y="46" width="160" height="36" rx="6" fill="#2563eb"/>
  <text x="768" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Schedule Order</text>

  <line x1="50" y1="110" x2="910" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Filters Toolbar -->
  <rect x="50" y="125" width="220" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Status: All Statuses ▼</text>

  <rect x="285" y="125" width="180" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Source: All Sources ▼</text>

  <!-- Quick Status Summary Pills -->
  <rect x="580" y="132" width="60" height="22" rx="11" fill="#dbeafe"/>
  <text x="590" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Plan (1)</text>

  <rect x="650" y="132" width="75" height="22" rx="11" fill="#fef3c7"/>
  <text x="660" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">Prog (2)</text>

  <rect x="735" y="132" width="75" height="22" rx="11" fill="#dcfce7"/>
  <text x="745" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">Done (1)</text>

  <rect x="820" y="132" width="70" height="22" rx="11" fill="#fee2e2"/>
  <text x="830" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Canc (1)</text>

  <!-- Table Card -->
  <rect x="50" y="180" width="860" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="180" width="860" height="35" rx="8" fill="#f8fafc"/>
  <text x="70" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ORDER ID</text>
  <text x="170" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRODUCT SKU &amp; NAME</text>
  <text x="410" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">QTY</text>
  <text x="470" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>
  <text x="590" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">DATES</text>
  <text x="730" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATE ACTIONS</text>
  <line x1="50" y1="215" x2="910" y2="215" stroke="#e2e8f0"/>

  <!-- Row 1: in_progress -->
  <text x="70" y="248" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0001</text>
  <text x="170" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0001 (55" 4K Smart TV)</text>
  <text x="410" y="248" font-family="monospace" font-size="13" fill="#0f172a">50</text>
  <rect x="470" y="234" width="85" height="20" rx="10" fill="#fef3c7"/>
  <text x="482" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">in_progress</text>
  <text x="590" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">11-12 → 11-15</text>
  <!-- Buttons -->
  <rect x="730" y="234" width="75" height="24" rx="4" fill="#16a34a"/>
  <text x="742" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Complete</text>
  <text x="820" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View &gt;</text>
  <line x1="50" y1="268" x2="910" y2="268" stroke="#f1f5f9"/>

  <!-- Row 2: planned -->
  <text x="70" y="300" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0003</text>
  <text x="170" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0001 (55" 4K Smart TV)</text>
  <text x="410" y="300" font-family="monospace" font-size="13" fill="#0f172a">100</text>
  <rect x="470" y="286" width="70" height="20" rx="10" fill="#dbeafe"/>
  <text x="482" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">planned</text>
  <text x="590" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">11-14 → 11-18</text>
  <!-- Buttons -->
  <rect x="730" y="286" width="50" height="24" rx="4" fill="#2563eb"/>
  <text x="742" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Start</text>
  <rect x="785" y="286" width="55" height="24" rx="4" fill="#fee2e2"/>
  <text x="795" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Cancel</text>
  <text x="850" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View &gt;</text>
  <line x1="50" y1="320" x2="910" y2="320" stroke="#f1f5f9"/>

  <!-- Row 3: completed -->
  <text x="70" y="352" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0004</text>
  <text x="170" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0001 (55" 4K Smart TV)</text>
  <text x="410" y="352" font-family="monospace" font-size="13" fill="#0f172a">40</text>
  <rect x="470" y="338" width="80" height="20" rx="10" fill="#dcfce7"/>
  <text x="480" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">completed</text>
  <text x="590" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">11-05 → 11-09</text>
  <text x="730" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Completed</text>
  <text x="820" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View &gt;</text>
  <line x1="50" y1="372" x2="910" y2="372" stroke="#f1f5f9"/>

  <!-- Row 4: cancelled -->
  <text x="70" y="404" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">WO-0005</text>
  <text x="170" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">SKU-0003 (65" OLED TV)</text>
  <text x="410" y="404" font-family="monospace" font-size="13" fill="#0f172a">10</text>
  <rect x="470" y="390" width="75" height="20" rx="10" fill="#fee2e2"/>
  <text x="480" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">cancelled</text>
  <text x="590" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">11-04 → 11-07</text>
  <text x="730" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Cancelled</text>
  <text x="820" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View &gt;</text>

  <!-- Footnote -->
  <text x="50" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Note: Legal lifecycle transitions: planned → in_progress → completed. Cancellation is strictly allowed only from planned status.</text>
</svg>
