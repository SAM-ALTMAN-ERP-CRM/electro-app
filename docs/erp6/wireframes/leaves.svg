<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background Canvas -->
  <rect width="960" height="600" fill="#f8fafc"/>

  <!-- Left Sidebar (Width 190) -->
  <rect x="0" y="0" width="190" height="600" fill="#0f172a"/>
  <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="700">⚡ Electro App</text>
  <text x="20" y="52" fill="#94a3b8" font-size="11">ERP-6 HR &amp; Workforce</text>

  <!-- Navigation Items -->
  <text x="24" y="90" fill="#cbd5e1" font-size="12">Employees</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12">Departments</text>
  <text x="24" y="152" fill="#cbd5e1" font-size="12">Attendance</text>
  <rect x="12" y="164" width="166" height="30" rx="6" fill="#334155"/>
  <text x="24" y="184" fill="#38bdf8" font-size="12" font-weight="600">Leaves</text>
  <text x="24" y="212" fill="#cbd5e1" font-size="12">Payroll</text>
  <text x="24" y="242" fill="#cbd5e1" font-size="12">Commissions</text>
  <text x="24" y="272" fill="#cbd5e1" font-size="12">Leaderboard</text>

  <text x="20" y="575" fill="#64748b" font-size="10">Print hides .sidebar &amp; .top-bar</text>

  <!-- Top Bar -->
  <rect x="190" y="0" width="770" height="48" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="29" fill="#0f172a" font-size="13" font-weight="600">/erp6/leaves — Leave Management &amp; Approvals</text>
  <rect x="850" y="12" width="90" height="24" rx="12" fill="#dcfce7"/>
  <text x="866" y="28" fill="#15803d" font-size="11" font-weight="600">Dev · Admin</text>

  <!-- Page Header -->
  <text x="214" y="80" fill="#0f172a" font-size="20" font-weight="700">Leave Requests &amp; Quotas</text>
  <rect x="475" y="64" width="70" height="20" rx="10" fill="#dbeafe"/>
  <text x="489" y="78" fill="#1d4ed8" font-size="10" font-weight="600">ERP-6 HR</text>
  <text x="214" y="100" fill="#64748b" font-size="12">Apply leave, audit 12-day annual balances, and authorize manager decisions.</text>

  <!-- Left Form Card: Apply Leave (width 260) -->
  <rect x="214" y="118" width="260" height="440" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="214" y="118" width="260" height="36" rx="8" fill="#f8fafc"/>
  <text x="230" y="141" fill="#0f172a" font-size="13" font-weight="700">Apply Leave Request</text>

  <text x="230" y="176" fill="#374151" font-size="11" font-weight="600">Employee:</text>
  <rect x="230" y="184" width="228" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="240" y="204" fill="#0f172a" font-size="11">Aarav Sharma (EMP-0001)</text>

  <text x="230" y="234" fill="#374151" font-size="11" font-weight="600">Leave Type:</text>
  <rect x="230" y="242" width="228" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="240" y="262" fill="#0f172a" font-size="11">Casual Leave (12d quota) ▼</text>

  <text x="230" y="292" fill="#374151" font-size="11" font-weight="600">From Date:</text>
  <rect x="230" y="300" width="228" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="240" y="320" fill="#0f172a" font-size="11">2026-11-20</text>

  <text x="230" y="350" fill="#374151" font-size="11" font-weight="600">To Date:</text>
  <rect x="230" y="358" width="228" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="240" y="378" fill="#0f172a" font-size="11">2026-11-21 (2 Days)</text>

  <text x="230" y="408" fill="#374151" font-size="11" font-weight="600">Reason:</text>
  <rect x="230" y="416" width="228" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="240" y="434" fill="#64748b" font-size="11">Family wedding in Pune</text>

  <rect x="230" y="482" width="228" height="34" rx="6" fill="#2563eb"/>
  <text x="305" y="504" fill="#ffffff" font-size="12" font-weight="600">Submit Request</text>

  <text x="230" y="540" fill="#64748b" font-size="10">Annual quota: 12 days. &gt;12 returns 400.</text>

  <!-- Right Requests Table (width 450) -->
  <rect x="490" y="118" width="450" height="440" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="490" y="118" width="450" height="36" rx="8" fill="#f8fafc"/>
  <text x="506" y="141" fill="#0f172a" font-size="13" font-weight="700">Pending &amp; Recent Requests</text>

  <text x="506" y="174" fill="#64748b" font-size="11" font-weight="600">ID / EMP</text>
  <text x="610" y="174" fill="#64748b" font-size="11" font-weight="600">DATES &amp; TYPE</text>
  <text x="750" y="174" fill="#64748b" font-size="11" font-weight="600">STATUS</text>
  <text x="860" y="174" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">DECISION</text>
  <line x1="490" y1="184" x2="940" y2="184" stroke="#e2e8f0"/>

  <!-- Row 1: LV-0001 (Pending) -->
  <text x="506" y="210" fill="#0f172a" font-family="monospace" font-size="11" font-weight="600">LV-0001</text>
  <text x="506" y="226" fill="#64748b" font-size="11">EMP-0003</text>
  <text x="610" y="210" fill="#0f172a" font-size="11" font-weight="600">2026-11-18 to 19</text>
  <text x="610" y="226" fill="#475569" font-size="10">Sick Leave (2d)</text>
  <rect x="740" y="202" width="60" height="18" rx="9" fill="#fef3c7"/>
  <text x="748" y="215" fill="#b45309" font-size="10" font-weight="600">PENDING</text>
  <!-- Buttons -->
  <rect x="825" y="202" width="42" height="20" rx="4" fill="#15803d"/>
  <text x="832" y="216" fill="#ffffff" font-size="10" font-weight="600">Approve</text>
  <rect x="872" y="202" width="38" height="20" rx="4" fill="#dc2626"/>
  <text x="878" y="216" fill="#ffffff" font-size="10" font-weight="600">Reject</text>
  <line x1="490" y1="242" x2="940" y2="242" stroke="#f1f5f9"/>

  <!-- Row 2: LV-0002 (Approved) -->
  <text x="506" y="268" fill="#0f172a" font-family="monospace" font-size="11" font-weight="600">LV-0002</text>
  <text x="506" y="284" fill="#64748b" font-size="11">EMP-0001</text>
  <text x="610" y="268" fill="#0f172a" font-size="11" font-weight="600">2026-11-05</text>
  <text x="610" y="284" fill="#475569" font-size="10">Casual Leave (1d)</text>
  <rect x="740" y="260" width="65" height="18" rx="9" fill="#dcfce7"/>
  <text x="746" y="273" fill="#15803d" font-size="10" font-weight="600">APPROVED</text>
  <text x="860" y="273" fill="#64748b" font-size="11" text-anchor="middle">Recorded</text>
  <line x1="490" y1="300" x2="940" y2="300" stroke="#f1f5f9"/>
</svg>
