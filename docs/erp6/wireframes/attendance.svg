<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background Canvas -->
  <rect width="960" height="600" fill="#f8fafc"/>

  <!-- Left Sidebar (Width 190) -->
  <rect x="0" y="0" width="190" height="600" fill="#0f172a"/>
  <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="700">⚡ Electro App</text>
  <text x="20" y="52" fill="#94a3b8" font-size="11">ERP-6 HR &amp; Workforce</text>

  <!-- Navigation Items -->
  <text x="24" y="90" fill="#cbd5e1" font-size="12">Employees</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12">Departments</text>
  <rect x="12" y="134" width="166" height="30" rx="6" fill="#334155"/>
  <text x="24" y="154" fill="#38bdf8" font-size="12" font-weight="600">Attendance</text>
  <text x="24" y="182" fill="#cbd5e1" font-size="12">Leaves</text>
  <text x="24" y="212" fill="#cbd5e1" font-size="12">Payroll</text>
  <text x="24" y="242" fill="#cbd5e1" font-size="12">Commissions</text>
  <text x="24" y="272" fill="#cbd5e1" font-size="12">Leaderboard</text>

  <text x="20" y="575" fill="#64748b" font-size="10">Print hides .sidebar &amp; .top-bar</text>

  <!-- Top Bar -->
  <rect x="190" y="0" width="770" height="48" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="29" fill="#0f172a" font-size="13" font-weight="600">/erp6/attendance — Daily Attendance Marker</text>
  <rect x="850" y="12" width="90" height="24" rx="12" fill="#dcfce7"/>
  <text x="866" y="28" fill="#15803d" font-size="11" font-weight="600">Dev · Admin</text>

  <!-- Page Header -->
  <text x="214" y="80" fill="#0f172a" font-size="20" font-weight="700">Daily Attendance Marker</text>
  <rect x="465" y="64" width="70" height="20" rx="10" fill="#dbeafe"/>
  <text x="479" y="78" fill="#1d4ed8" font-size="10" font-weight="600">ERP-6 HR</text>
  <text x="214" y="100" fill="#64748b" font-size="12">Mark present, absent, half-day, or leave logs. Synchronized with monthly payroll.</text>

  <!-- Date Chooser & Action Bar -->
  <rect x="214" y="118" width="180" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="228" y="140" fill="#0f172a" font-size="12">📅 Date: 2026-11-13</text>

  <rect x="404" y="118" width="100" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="428" y="140" fill="#475569" font-size="12">Today</text>

  <!-- 3 Status Count Pills -->
  <rect x="520" y="122" width="80" height="26" rx="13" fill="#dcfce7"/>
  <text x="532" y="139" fill="#15803d" font-size="11" font-weight="600">10 Present</text>

  <rect x="610" y="122" width="75" height="26" rx="13" fill="#fef3c7"/>
  <text x="622" y="139" fill="#b45309" font-size="11" font-weight="600">1 Half Day</text>

  <rect x="695" y="122" width="70" height="26" rx="13" fill="#fee2e2"/>
  <text x="707" y="139" fill="#b91c1c" font-size="11" font-weight="600">1 Absent</text>

  <rect x="800" y="118" width="140" height="34" rx="6" fill="#2563eb"/>
  <text x="816" y="140" fill="#ffffff" font-size="12" font-weight="600">💾 Save Attendance</text>

  <!-- Table Container Card -->
  <rect x="214" y="168" width="726" height="395" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Table Header -->
  <rect x="214" y="168" width="726" height="36" rx="8" fill="#f8fafc"/>
  <text x="230" y="191" fill="#64748b" font-size="11" font-weight="600">EMP ID</text>
  <text x="320" y="191" fill="#64748b" font-size="11" font-weight="600">EMPLOYEE NAME</text>
  <text x="480" y="191" fill="#64748b" font-size="11" font-weight="600">DEPARTMENT</text>
  <text x="620" y="191" fill="#64748b" font-size="11" font-weight="600">STATUS (RADIO OPTIONS)</text>
  <text x="850" y="191" fill="#64748b" font-size="11" font-weight="600">CHECK-IN</text>
  <line x1="214" y1="204" x2="940" y2="204" stroke="#e2e8f0"/>

  <!-- Row 1: EMP-0001 Present -->
  <text x="230" y="235" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">EMP-0001</text>
  <text x="320" y="235" fill="#0f172a" font-size="12" font-weight="600">Aarav Sharma</text>
  <text x="480" y="235" fill="#475569" font-size="12">Sales</text>
  <!-- Radios -->
  <circle cx="628" cy="231" r="6" fill="#2563eb"/>
  <circle cx="628" cy="231" r="2.5" fill="#ffffff"/>
  <text x="640" y="235" fill="#15803d" font-size="12" font-weight="600">Present</text>
  <circle cx="700" cy="231" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="712" y="235" fill="#64748b" font-size="12">Absent</text>
  <circle cx="765" cy="231" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="777" y="235" fill="#64748b" font-size="12">Half Day</text>
  <text x="850" y="235" fill="#0f172a" font-size="12">09:15 AM</text>
  <line x1="214" y1="256" x2="940" y2="256" stroke="#f1f5f9"/>

  <!-- Row 2: EMP-0002 Present -->
  <text x="230" y="287" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">EMP-0002</text>
  <text x="320" y="287" fill="#0f172a" font-size="12" font-weight="600">Priya Nair</text>
  <text x="480" y="287" fill="#475569" font-size="12">Sales</text>
  <circle cx="628" cy="283" r="6" fill="#2563eb"/>
  <circle cx="628" cy="283" r="2.5" fill="#ffffff"/>
  <text x="640" y="287" fill="#15803d" font-size="12" font-weight="600">Present</text>
  <circle cx="700" cy="283" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="712" y="287" fill="#64748b" font-size="12">Absent</text>
  <circle cx="765" cy="283" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="777" y="287" fill="#64748b" font-size="12">Half Day</text>
  <text x="850" y="287" fill="#0f172a" font-size="12">09:22 AM</text>
  <line x1="214" y1="308" x2="940" y2="308" stroke="#f1f5f9"/>

  <!-- Row 3: EMP-0003 Absent -->
  <text x="230" y="339" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">EMP-0003</text>
  <text x="320" y="339" fill="#0f172a" font-size="12" font-weight="600">Vikram Patel</text>
  <text x="480" y="339" fill="#475569" font-size="12">Field Service</text>
  <circle cx="628" cy="335" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="640" y="339" fill="#64748b" font-size="12">Present</text>
  <circle cx="700" cy="335" r="6" fill="#dc2626"/>
  <circle cx="700" cy="335" r="2.5" fill="#ffffff"/>
  <text x="712" y="339" fill="#b91c1c" font-size="12" font-weight="600">Absent</text>
  <circle cx="765" cy="335" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="777" y="339" fill="#64748b" font-size="12">Half Day</text>
  <text x="850" y="339" fill="#dc2626" font-size="12">—</text>
  <line x1="214" y1="360" x2="940" y2="360" stroke="#f1f5f9"/>

  <!-- Row 4: EMP-0004 Half Day -->
  <text x="230" y="391" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">EMP-0004</text>
  <text x="320" y="391" fill="#0f172a" font-size="12" font-weight="600">Ananya Roy</text>
  <text x="480" y="391" fill="#475569" font-size="12">Field Service</text>
  <circle cx="628" cy="387" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="640" y="391" fill="#64748b" font-size="12">Present</text>
  <circle cx="700" cy="387" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="712" y="391" fill="#64748b" font-size="12">Absent</text>
  <circle cx="765" cy="387" r="6" fill="#d97706"/>
  <circle cx="765" cy="387" r="2.5" fill="#ffffff"/>
  <text x="777" y="391" fill="#b45309" font-size="12" font-weight="600">Half Day</text>
  <text x="850" y="391" fill="#0f172a" font-size="12">01:30 PM</text>
  <line x1="214" y1="412" x2="940" y2="412" stroke="#f1f5f9"/>
</svg>
