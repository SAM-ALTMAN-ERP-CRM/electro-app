<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background Canvas -->
  <rect width="960" height="600" fill="#f8fafc"/>

  <!-- Left Sidebar (Width 190) -->
  <rect x="0" y="0" width="190" height="600" fill="#0f172a"/>
  <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="700">⚡ Electro App</text>
  <text x="20" y="52" fill="#94a3b8" font-size="11">ERP-6 HR &amp; Workforce</text>

  <!-- Navigation Items -->
  <text x="24" y="90" fill="#cbd5e1" font-size="12">Employees</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12">Departments</text>
  <text x="24" y="152" fill="#cbd5e1" font-size="12">Attendance</text>
  <text x="24" y="182" fill="#cbd5e1" font-size="12">Leaves</text>
  <rect x="12" y="194" width="166" height="30" rx="6" fill="#334155"/>
  <text x="24" y="214" fill="#38bdf8" font-size="12" font-weight="600">Payroll &gt; Slip</text>
  <text x="24" y="242" fill="#cbd5e1" font-size="12">Commissions</text>
  <text x="24" y="272" fill="#cbd5e1" font-size="12">Leaderboard</text>

  <text x="20" y="575" fill="#64748b" font-size="10">Print hides .sidebar &amp; .top-bar</text>

  <!-- Top Bar -->
  <rect x="190" y="0" width="770" height="48" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="29" fill="#0f172a" font-size="13" font-weight="600">/erp6/payroll/SLIP-0001 — Salary Slip Detail</text>
  <rect x="850" y="12" width="90" height="24" rx="12" fill="#dcfce7"/>
  <text x="866" y="28" fill="#15803d" font-size="11" font-weight="600">Dev · Admin</text>

  <!-- Screen-Only Toolbar (no-print) -->
  <rect x="214" y="58" width="726" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="228" y="80" fill="#2563eb" font-size="12" font-weight="600">&lt;-- Back to Payroll</text>
  <rect x="800" y="62" width="130" height="28" rx="4" fill="#1e293b"/>
  <text x="814" y="80" fill="#ffffff" font-size="11" font-weight="600">🖨️ Print Slip (1 Page)</text>

  <!-- Printable Slip Container (fits 1 Page A4) -->
  <rect x="260" y="104" width="630" height="480" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Company Letterhead -->
  <text x="280" y="132" fill="#0f172a" font-size="16" font-weight="800">ELECTRO CRM &amp; ERP LTD.</text>
  <text x="280" y="146" fill="#475569" font-size="9">Plot 42, Electronic City Phase 1, Bangalore, Karnataka - 560100</text>
  <rect x="760" y="118" width="110" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="772" y="133" fill="#0f172a" font-size="10" font-weight="700">SALARY SLIP</text>
  <text x="772" y="152" fill="#64748b" font-size="10">Month: 2026-11</text>
  <line x1="280" y1="160" x2="870" y2="160" stroke="#0f172a" stroke-width="1"/>

  <!-- Employee Info Box -->
  <rect x="280" y="168" width="590" height="54" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="290" y="186" fill="#64748b" font-size="10">Emp ID: <tspan fill="#0f172a" font-weight="700">EMP-0001</tspan></text>
  <text x="290" y="202" fill="#64748b" font-size="10">Name: <tspan fill="#0f172a" font-weight="700">Aarav Sharma</tspan></text>
  <text x="290" y="214" fill="#64748b" font-size="9">Dept: Sales (DEP-01)</text>

  <text x="590" y="186" fill="#64748b" font-size="10">Slip No: <tspan fill="#0f172a" font-weight="700">SLIP-0001</tspan></text>
  <text x="590" y="202" fill="#64748b" font-size="10">Role: Senior Sales Exec</text>
  <rect x="780" y="188" width="70" height="18" rx="9" fill="#dcfce7"/>
  <text x="802" y="201" fill="#15803d" font-size="9" font-weight="700">PAID</text>

  <!-- Side-by-Side Tables -->
  <!-- Left: Earnings -->
  <rect x="280" y="230" width="290" height="170" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="280" y="230" width="290" height="24" rx="4" fill="#f1f5f9"/>
  <text x="290" y="246" fill="#0f172a" font-size="11" font-weight="700">EARNINGS</text>
  <text x="560" y="246" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">AMOUNT</text>

  <text x="290" y="272" fill="#475569" font-size="10">Basic Salary</text>
  <text x="560" y="272" fill="#0f172a" font-size="10" text-anchor="end">₹45,000.00</text>

  <text x="290" y="296" fill="#475569" font-size="10">HRA (40% of Basic)</text>
  <text x="560" y="296" fill="#0f172a" font-size="10" text-anchor="end">₹18,000.00</text>

  <text x="290" y="320" fill="#475569" font-size="10">Special Allowances</text>
  <text x="560" y="320" fill="#0f172a" font-size="10" text-anchor="end">₹2,000.00</text>

  <text x="290" y="344" fill="#475569" font-size="10">Sales Commission</text>
  <text x="560" y="344" fill="#0f172a" font-size="10" text-anchor="end">₹10,500.00</text>

  <line x1="280" y1="365" x2="570" y2="365" stroke="#e2e8f0"/>
  <text x="290" y="386" fill="#0f172a" font-size="11" font-weight="700">Gross Earnings (A)</text>
  <text x="560" y="386" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">₹75,500.00</text>

  <!-- Right: Deductions -->
  <rect x="580" y="230" width="290" height="170" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="580" y="230" width="290" height="24" rx="4" fill="#f1f5f9"/>
  <text x="590" y="246" fill="#0f172a" font-size="11" font-weight="700">DEDUCTIONS</text>
  <text x="860" y="246" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">AMOUNT</text>

  <text x="590" y="272" fill="#475569" font-size="10">Provident Fund (PF - 12%)</text>
  <text x="860" y="272" fill="#dc2626" font-size="10" text-anchor="end">₹5,400.00</text>

  <text x="590" y="296" fill="#475569" font-size="10">Absenteeism (1 Day)</text>
  <text x="860" y="296" fill="#dc2626" font-size="10" text-anchor="end">₹1,500.00</text>

  <text x="590" y="320" fill="#475569" font-size="10">Professional Tax (PT)</text>
  <text x="860" y="320" fill="#475569" font-size="10" text-anchor="end">₹0.00</text>

  <text x="590" y="344" fill="#475569" font-size="10">Income Tax (TDS)</text>
  <text x="860" y="344" fill="#475569" font-size="10" text-anchor="end">₹0.00</text>

  <line x1="580" y1="365" x2="870" y2="365" stroke="#e2e8f0"/>
  <text x="590" y="386" fill="#0f172a" font-size="11" font-weight="700">Total Deductions (B)</text>
  <text x="860" y="386" fill="#dc2626" font-size="11" font-weight="700" text-anchor="end">₹6,900.00</text>

  <!-- Net Pay Highlight Box -->
  <rect x="280" y="410" width="590" height="42" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="290" y="428" fill="#166534" font-size="11" font-weight="700">NET PAYABLE AMOUNT (A - B):</text>
  <text x="290" y="444" fill="#475569" font-size="9" font-style="italic">Amount in words: Sixty Eight Thousand Six Hundred Rupees Only</text>
  <text x="860" y="437" fill="#15803d" font-size="18" font-weight="800" text-anchor="end">₹68,600.00</text>

  <!-- Signatures -->
  <line x1="310" y1="520" x2="430" y2="520" stroke="#94a3b8"/>
  <text x="325" y="534" fill="#64748b" font-size="9">Employee Signature</text>

  <line x1="720" y1="520" x2="840" y2="520" stroke="#94a3b8"/>
  <text x="735" y="534" fill="#64748b" font-size="9">Authorised Signatory</text>
</svg>
