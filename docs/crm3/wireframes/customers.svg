<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-3 Customers Directory Wireframe</title>
  <desc id="desc">Wireframe layout for /crm3 (Customers Directory &amp; Add Form)</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Customers Directory</text>
  <rect x="300" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="315" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-3</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Single customer master directory with multi-contact management</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Search & Filter Controls -->
  <rect x="50" y="130" width="340" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">🔍 Search by name, city, email...</text>
  <rect x="405" y="130" width="160" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="420" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Type: All Types ▼</text>

  <!-- Table Card -->
  <rect x="50" y="185" width="860" height="175" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Table Header -->
  <rect x="50" y="185" width="860" height="35" rx="6" fill="#f8fafc"/>
  <text x="70" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CUSTOMER ID</text>
  <text x="200" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">NAME</text>
  <text x="420" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TYPE</text>
  <text x="530" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CITY</text>
  <text x="660" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PHONE</text>
  <text x="810" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIONS</text>
  <line x1="50" y1="220" x2="910" y2="220" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="248" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">CUST-0001</text>
  <text x="200" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Aarav Mehta</text>
  <rect x="420" y="234" width="55" height="20" rx="10" fill="#dbeafe"/>
  <text x="430" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">retail</text>
  <text x="530" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Mumbai</text>
  <text x="660" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">9820011111</text>
  <text x="810" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="265" x2="910" y2="265" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="293" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">CUST-0002</text>
  <text x="200" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Sunrise Electronics Pvt Ltd</text>
  <rect x="420" y="279" width="75" height="20" rx="10" fill="#dcfce7"/>
  <text x="430" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">corporate</text>
  <text x="530" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Mumbai</text>
  <text x="660" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">9820022222</text>
  <text x="810" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View Details &gt;</text>
  <line x1="50" y1="310" x2="910" y2="310" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="70" y="338" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">CUST-0004</text>
  <text x="200" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">BrightHome Retail LLP</text>
  <rect x="420" y="324" width="58" height="20" rx="10" fill="#fef3c7"/>
  <text x="430" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">dealer</text>
  <text x="530" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Pune</text>
  <text x="660" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">9820044444</text>
  <text x="810" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View Details &gt;</text>

  <!-- Add New Customer Card -->
  <rect x="50" y="380" width="860" height="175" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="75" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Add New Customer</text>

  <!-- Form inputs -->
  <rect x="75" y="430" width="250" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Customer Name *</text>

  <rect x="345" y="430" width="130" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="355" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Retail ▼</text>

  <rect x="495" y="430" width="180" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Email *</text>

  <rect x="695" y="430" width="190" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="705" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Phone (10 digits) *</text>

  <rect x="75" y="475" width="370" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Billing Address *</text>

  <rect x="465" y="475" width="200" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="475" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">City *</text>

  <!-- Submit Button -->
  <rect x="75" y="515" width="150" height="32" rx="6" fill="#2563eb"/>
  <text x="105" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Save Customer</text>
</svg>
