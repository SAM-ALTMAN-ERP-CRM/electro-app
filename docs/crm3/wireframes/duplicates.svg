<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-3 Duplicate Detection &amp; Merge Wireframe</title>
  <desc id="desc">Wireframe layout for /crm3/duplicates (Side-by-side Duplicate Groups &amp; Merge Flow)</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Duplicate Customer Detection</text>
  <rect x="410" y="47" width="70" height="24" rx="12" fill="#fee2e2"/>
  <text x="425" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">CRM-3</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Identify customer accounts sharing duplicate phone numbers or emails, and merge them safely</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0"/>

  <!-- Duplicate Group 1 Card -->
  <rect x="50" y="135" width="860" height="195" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="50" y="135" width="860" height="35" rx="8" fill="#fef2f2"/>
  <text x="70" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">DUPLICATE GROUP: Shared Phone Number (9820011111)</text>
  <text x="750" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">2 records matched</text>

  <!-- Left Customer Card (CUST-0001) -->
  <rect x="70" y="180" width="395" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="85" y="205" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">CUST-0001</text>
  <rect x="175" y="192" width="55" height="18" rx="9" fill="#dbeafe"/>
  <text x="185" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">retail</text>
  <text x="85" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Aarav Mehta</text>
  <text x="85" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Email: aarav.mehta@example.com · City: Mumbai</text>
  <text x="85" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Phone: <tspan font-weight="700" fill="#b91c1c">9820011111</tspan> · Contacts: 1</text>

  <rect x="85" y="280" width="130" height="26" rx="4" fill="#2563eb"/>
  <text x="105" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Keep This Customer</text>

  <!-- Right Customer Card (CUST-0009) -->
  <rect x="495" y="180" width="395" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="510" y="205" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">CUST-0009</text>
  <rect x="600" y="192" width="55" height="18" rx="9" fill="#dbeafe"/>
  <text x="610" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">retail</text>
  <text x="510" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Aarav Mehta (Duplicate Seed)</text>
  <text x="510" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Email: aarav.dup@example.com · City: Mumbai</text>
  <text x="510" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Phone: <tspan font-weight="700" fill="#b91c1c">9820011111</tspan> · Contacts: 0</text>

  <rect x="510" y="280" width="130" height="26" rx="4" fill="#2563eb"/>
  <text x="530" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Keep This Customer</text>

  <!-- Duplicate Group 2 Card Preview -->
  <rect x="50" y="350" width="860" height="110" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="50" y="350" width="860" height="35" rx="8" fill="#fef2f2"/>
  <text x="70" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">DUPLICATE GROUP: Shared Phone Number (9820022222)</text>
  <text x="750" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">2 records matched</text>
  <text x="70" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Pair: CUST-0002 (Sunrise Electronics Pvt Ltd) &amp; CUST-0010 (Sunrise Electronics Duplicate)</text>

  <!-- Merge Info Banner -->
  <rect x="50" y="480" width="860" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Atomic Transactional Merge</text>
  <text x="70" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">POST /api/customers/merge moves contacts, interactions, and customer tags from the removed customer to the kept customer within a single SQL transaction before safely deleting the duplicate.</text>
</svg>
