<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-3 Segments Directory Wireframe</title>
  <desc id="desc">Wireframe layout for /crm3/segments (List Segments &amp; Creation Form)</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Customer Segments</text>
  <rect x="300" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="315" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-3</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Manage targeted customer cohorts and export matching records</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0"/>

  <!-- Segments Directory Table Card -->
  <rect x="50" y="140" width="860" height="205" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="140" width="860" height="35" rx="6" fill="#f8fafc"/>
  <text x="70" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SEGMENT ID</text>
  <text x="180" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">NAME</text>
  <text x="390" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TARGET TYPE</text>
  <text x="540" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TARGET CITY</text>
  <text x="730" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIONS</text>
  <line x1="50" y1="175" x2="910" y2="175" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="202" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">SEG-0001</text>
  <text x="180" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Corporate in Mumbai</text>
  <rect x="390" y="188" width="75" height="20" rx="10" fill="#dcfce7"/>
  <text x="400" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">corporate</text>
  <text x="540" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Mumbai</text>
  <text x="730" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View Cohort &gt;</text>
  <line x1="50" y1="218" x2="910" y2="218" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="245" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">SEG-0002</text>
  <text x="180" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">All Retail Customers</text>
  <rect x="390" y="231" width="55" height="20" rx="10" fill="#dbeafe"/>
  <text x="400" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">retail</text>
  <text x="540" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">All Cities</text>
  <text x="730" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View Cohort &gt;</text>
  <line x1="50" y1="261" x2="910" y2="261" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="70" y="288" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">SEG-0003</text>
  <text x="180" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Dealers in Pune</text>
  <rect x="390" y="274" width="55" height="20" rx="10" fill="#fef3c7"/>
  <text x="400" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">dealer</text>
  <text x="540" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Pune</text>
  <text x="730" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View Cohort &gt;</text>
  <line x1="50" y1="304" x2="910" y2="304" stroke="#f1f5f9"/>

  <!-- Row 4 -->
  <text x="70" y="330" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">SEG-0004</text>
  <text x="180" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Delhi NCR Clients</text>
  <text x="390" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">All Types</text>
  <text x="540" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Delhi</text>
  <text x="730" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">View Cohort &gt;</text>

  <!-- Create Segment Form Card -->
  <rect x="50" y="375" width="860" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="75" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Create New Segment</text>
  <text x="75" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Define targeted audience criteria based on customer type and location</text>

  <!-- Input fields -->
  <rect x="75" y="445" width="340" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="467" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Segment Name (e.g., Premium Dealers) *</text>

  <rect x="430" y="445" width="200" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="467" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Customer Type: All Types ▼</text>

  <rect x="645" y="445" width="200" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="655" y="467" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Target City: All Cities ▼</text>

  <!-- Submit button -->
  <rect x="75" y="498" width="160" height="36" rx="6" fill="#2563eb"/>
  <text x="100" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Create Segment</text>
</svg>
