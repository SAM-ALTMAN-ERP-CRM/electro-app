<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-3 Customer Detail Wireframe</title>
  <desc id="desc">Wireframe layout for /crm3/customers/:id (Profile, Tags &amp; Contacts)</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Back link & Header -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">&lt; Back to Customers</text>
  <text x="50" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Sunrise Electronics Pvt Ltd</text>
  <rect x="350" y="73" width="75" height="20" rx="10" fill="#dcfce7"/>
  <text x="360" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">corporate</text>

  <text x="50" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Customer ID: <tspan font-family="monospace" font-weight="600" fill="#0f172a">CUST-0002</tspan> · GSTIN: <tspan font-family="monospace">27AABCS1234F1Z5</tspan> · City: Mumbai</text>

  <!-- Timeline Action Button -->
  <rect x="710" y="70" width="190" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="725" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">⏱ View Timeline Feed</text>
  <line x1="50" y1="135" x2="910" y2="135" stroke="#e2e8f0"/>

  <!-- Customer Tags Section -->
  <rect x="50" y="150" width="860" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Customer Tags</text>

  <!-- Tag chips -->
  <rect x="70" y="190" width="70" height="26" rx="13" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="82" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3730a3">VIP ×</text>

  <rect x="150" y="190" width="130" height="26" rx="13" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="162" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3730a3">Corporate Tier 1 ×</text>

  <!-- Add Tag Input & Button -->
  <rect x="300" y="190" width="140" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="310" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Enter tag name...</text>
  <rect x="448" y="190" width="80" height="26" rx="4" fill="#2563eb"/>
  <text x="460" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">+ Add Tag</text>

  <!-- Address info cards -->
  <rect x="50" y="250" width="415" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="65" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">BILLING ADDRESS</text>
  <text x="65" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">45 Nariman Point, Express Towers</text>
  <text x="65" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Mumbai, Maharashtra</text>

  <rect x="495" y="250" width="415" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="510" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SHIPPING ADDRESS</text>
  <text x="510" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">45 Nariman Point, Express Towers</text>
  <text x="510" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Mumbai, Maharashtra</text>

  <!-- Contacts Table Header -->
  <text x="50" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Customer Contacts (2)</text>
  <rect x="50" y="370" width="860" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="370" width="860" height="30" rx="6" fill="#f8fafc"/>
  <text x="70" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">NAME</text>
  <text x="260" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PHONE</text>
  <text x="440" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">EMAIL</text>
  <text x="680" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">DESIGNATION</text>
  <line x1="50" y1="400" x2="910" y2="400" stroke="#e2e8f0"/>

  <text x="70" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Rajesh Gupta</text>
  <text x="260" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">9820022223</text>
  <text x="440" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">r.gupta@sunrise.com</text>
  <text x="680" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Procurement Manager</text>
  <line x1="50" y1="440" x2="910" y2="440" stroke="#f1f5f9"/>

  <text x="70" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Neha Sharma</text>
  <text x="260" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">9820022224</text>
  <text x="440" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">neha@sunrise.com</text>
  <text x="680" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Accounts Lead</text>

  <!-- Add contact footer -->
  <rect x="50" y="500" width="860" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563eb">+ Add New Contact to this Customer</text>
</svg>
