<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-2 Assign Tickets Wireframe</title>
  <desc id="desc">Unassigned tickets list, regional centre selector, and one-click assign button</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Assign Tickets to Centres</text>
  <rect x="360" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="375" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-2</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Route open and in-progress customer tickets to regional service and repair centres</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Info / Count Banner -->
  <rect x="50" y="130" width="860" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">ℹ 2 tickets awaiting service centre assignment</text>

  <!-- Table Card -->
  <rect x="50" y="190" width="860" height="340" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="190" width="860" height="35" rx="6" fill="#f8fafc"/>
  <text x="70" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TICKET ID</text>
  <text x="170" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CUSTOMER</text>
  <text x="340" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SUBJECT</text>
  <text x="510" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>
  <text x="610" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ASSIGN TO CENTRE</text>
  <text x="815" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTION</text>
  <line x1="50" y1="225" x2="910" y2="225" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="255" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TKT-0004</text>
  <text x="170" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">BrightHome Retail</text>
  <text x="340" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Dead pixels on panel</text>
  <rect x="510" y="241" width="55" height="20" rx="10" fill="#dbeafe"/>
  <text x="522" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">open</text>
  <rect x="610" y="238" width="180" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="620" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">SC-0002 (Pune Hub) ▼</text>
  <rect x="805" y="238" width="85" height="32" rx="6" fill="#2563eb"/>
  <text x="825" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Assign</text>
  <line x1="50" y1="280" x2="910" y2="280" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="310" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TKT-0005</text>
  <text x="170" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Metro Offices Ltd</text>
  <text x="340" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Installation visit request</text>
  <rect x="510" y="296" width="55" height="20" rx="10" fill="#dbeafe"/>
  <text x="522" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">open</text>
  <rect x="610" y="293" width="180" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="620" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">SC-0001 (Mumbai Care) ▼</text>
  <rect x="805" y="293" width="85" height="32" rx="6" fill="#2563eb"/>
  <text x="825" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Assign</text>
</svg>
