<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-2 Tickets Directory Wireframe</title>
  <desc id="desc">Tickets list, SLA countdown, filter tabs, and new ticket modal trigger</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top bar / Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Support Tickets</text>
  <rect x="250" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="265" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-2</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Manage customer issues, SLA timelines, and technician dispatch</text>
  <rect x="790" y="45" width="120" height="34" rx="6" fill="#2563eb"/>
  <text x="815" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ New Ticket</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Search & Filters -->
  <rect x="50" y="130" width="280" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">🔍 Filter by customer, ID...</text>
  <rect x="345" y="130" width="150" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Status: All ▼</text>
  <rect x="510" y="130" width="150" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="525" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Priority: All ▼</text>

  <!-- Table Card -->
  <rect x="50" y="185" width="860" height="280" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Table Header -->
  <rect x="50" y="185" width="860" height="35" rx="6" fill="#f8fafc"/>
  <text x="70" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">TICKET ID</text>
  <text x="160" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CUSTOMER</text>
  <text x="320" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SUBJECT</text>
  <text x="490" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRIORITY</text>
  <text x="580" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>
  <text x="690" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SLA / DUE</text>
  <text x="810" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTION</text>
  <line x1="50" y1="220" x2="910" y2="220" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="250" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TKT-0001</text>
  <text x="160" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Aarav Mehta</text>
  <text x="320" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">TV screen flickers</text>
  <rect x="490" y="236" width="55" height="20" rx="10" fill="#fee2e2"/>
  <text x="502" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">high</text>
  <rect x="580" y="236" width="85" height="20" rx="10" fill="#fef3c7"/>
  <text x="590" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">in_progress</text>
  <rect x="690" y="236" width="65" height="20" rx="10" fill="#fee2e2"/>
  <text x="698" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Overdue</text>
  <text x="810" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View &gt;</text>
  <line x1="50" y1="268" x2="910" y2="268" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="300" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TKT-0002</text>
  <text x="160" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Sunrise Electronics</text>
  <text x="320" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">No sound from HDMI</text>
  <rect x="490" y="286" width="60" height="20" rx="10" fill="#fef3c7"/>
  <text x="497" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">medium</text>
  <rect x="580" y="286" width="55" height="20" rx="10" fill="#dbeafe"/>
  <text x="592" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">open</text>
  <rect x="690" y="286" width="65" height="20" rx="10" fill="#fee2e2"/>
  <text x="698" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Overdue</text>
  <text x="810" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View &gt;</text>
  <line x1="50" y1="318" x2="910" y2="318" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="70" y="350" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TKT-0003</text>
  <text x="160" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">Priya Nair</text>
  <text x="320" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Remote not pairing</text>
  <rect x="490" y="336" width="45" height="20" rx="10" fill="#dbeafe"/>
  <text x="502" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">low</text>
  <rect x="580" y="336" width="65" height="20" rx="10" fill="#dcfce7"/>
  <text x="588" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">resolved</text>
  <text x="690" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Closed</text>
  <text x="810" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#2563eb">View &gt;</text>
</svg>
