<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-2 Ticket Detail Wireframe</title>
  <desc id="desc">Ticket details view, status update, engineer assignment, and comments log</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Breadcrumb & Header -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">&lt; Back to Tickets</text>
  <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Ticket TKT-0001: TV screen flickers</text>
  <rect x="520" y="68" width="85" height="22" rx="11" fill="#fef3c7"/>
  <text x="530" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">in_progress</text>
  <rect x="615" y="68" width="65" height="22" rx="11" fill="#fee2e2"/>
  <text x="623" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Overdue</text>
  <line x1="50" y1="110" x2="910" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: Details -->
  <rect x="50" y="130" width="460" height="420" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Ticket Information</text>

  <text x="70" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Customer</text>
  <text x="70" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Aarav Mehta (CUST-0001)</text>

  <text x="70" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Serial Number</text>
  <text x="70" y="270" font-family="monospace" font-size="13" fill="#0f172a">TV55-2611-0001</text>

  <text x="70" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Description</text>
  <text x="70" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Screen flickers every few minutes after the TV warms up.</text>

  <text x="70" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Change Status</text>
  <rect x="70" y="380" width="160" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">in_progress ▼</text>
  <rect x="240" y="380" width="80" height="34" rx="6" fill="#2563eb"/>
  <text x="255" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Save</text>

  <text x="70" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Assigned Service Engineer</text>
  <text x="70" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Imran Qureshi (EMP-0005)</text>

  <!-- Right Column: Comments & SLA -->
  <rect x="530" y="130" width="380" height="420" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="550" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Activity &amp; Comments</text>
  <rect x="550" y="180" width="340" height="50" rx="6" fill="#f1f5f9"/>
  <text x="560" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">System Administrator · 5h ago</text>
  <text x="560" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">Customer confirmed the flicker. Engineer visit booked.</text>

  <rect x="550" y="240" width="340" height="50" rx="6" fill="#f1f5f9"/>
  <text x="560" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Imran Qureshi · 2h ago</text>
  <text x="560" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">Visited site. Backlight driver board suspected.</text>

  <!-- Add comment box -->
  <rect x="550" y="320" width="340" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Add an update or internal note...</text>
  <rect x="800" y="410" width="90" height="30" rx="6" fill="#2563eb"/>
  <text x="815" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Comment</text>
</svg>
