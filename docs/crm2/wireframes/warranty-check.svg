<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-2 Warranty Check Wireframe</title>
  <desc id="desc">Serial number lookup, active/expired badge, ERP-4 sync trigger, and warranty directory</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Warranty Verification</text>
  <rect x="310" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="325" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-2</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Check coverage status by device serial number and sync shipments from ERP-4</text>
  <rect x="760" y="45" width="150" height="34" rx="6" fill="#0f172a"/>
  <text x="778" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">🔄 Sync from ERP-4</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lookup Search Box -->
  <rect x="50" y="135" width="860" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="70" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Look Up Serial Number</text>
  <rect x="70" y="172" width="380" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="195" font-family="monospace" font-size="13" fill="#0f172a">TV55-2611-0001</text>
  <rect x="465" y="172" width="110" height="36" rx="6" fill="#2563eb"/>
  <text x="495" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Check</text>

  <!-- Result Banner -->
  <rect x="50" y="235" width="860" height="60" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="70" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d">Serial TV55-2611-0001 is IN WARRANTY</text>
  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#166534">55-inch 4K Smart TV · Customer: CUST-0001 (Aarav Mehta) · Valid until 12 Aug 2027</text>

  <!-- Table: Registered Serials -->
  <rect x="50" y="315" width="860" height="225" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="315" width="860" height="35" rx="6" fill="#f8fafc"/>
  <text x="70" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">SERIAL NUMBER</text>
  <text x="230" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRODUCT</text>
  <text x="440" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">CUSTOMER</text>
  <text x="590" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PURCHASE DATE</text>
  <text x="730" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>
  <line x1="50" y1="350" x2="910" y2="350" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="70" y="380" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TV55-2611-0001</text>
  <text x="230" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">55-inch Smart TV</text>
  <text x="440" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">CUST-0001</text>
  <text x="590" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">2026-08-12</text>
  <rect x="730" y="366" width="90" height="20" rx="10" fill="#dcfce7"/>
  <text x="742" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">In warranty</text>
  <line x1="50" y1="398" x2="910" y2="398" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="70" y="425" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">TV55-2611-0004</text>
  <text x="230" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a">55-inch Smart TV</text>
  <text x="440" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">CUST-0004</text>
  <text x="590" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">2024-11-01</text>
  <rect x="730" y="411" width="70" height="20" rx="10" fill="#fee2e2"/>
  <text x="745" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Expired</text>
</svg>
