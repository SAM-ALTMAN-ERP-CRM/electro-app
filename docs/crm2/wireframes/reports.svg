<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CRM-2 Support Reports Wireframe</title>
  <desc id="desc">Ticket summary KPIs, status/priority breakdown, resolution metrics, and tickets per centre</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="920" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Page Header -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Support &amp; Warranty Reports</text>
  <rect x="400" y="47" width="70" height="24" rx="12" fill="#dbeafe"/>
  <text x="415" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CRM-2</text>
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Key service performance indicators, SLA resolution metrics, and centre allocation</text>
  <line x1="50" y1="115" x2="910" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- KPI Cards Row -->
  <rect x="50" y="130" width="195" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">TOTAL TICKETS</text>
  <text x="70" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0f172a">6</text>

  <rect x="270" y="130" width="195" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="290" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">OVERDUE TICKETS</text>
  <text x="290" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#dc2626">3</text>

  <rect x="490" y="130" width="195" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="510" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">AVG RESOLUTION</text>
  <text x="510" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#2563eb">24.5 h</text>

  <rect x="710" y="130" width="200" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="730" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">ACTIVE CENTRES</text>
  <text x="730" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#15803d">4</text>

  <!-- Left: Status Breakdown & CSS Bar Chart -->
  <rect x="50" y="235" width="415" height="305" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tickets by Status</text>

  <text x="70" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Open (3)</text>
  <rect x="70" y="310" width="375" height="18" rx="4" fill="#f1f5f9"/>
  <rect x="70" y="310" width="188" height="18" rx="4" fill="#3b82f6"/>

  <text x="70" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">In Progress (1)</text>
  <rect x="70" y="365" width="375" height="18" rx="4" fill="#f1f5f9"/>
  <rect x="70" y="365" width="62" height="18" rx="4" fill="#f59e0b"/>

  <text x="70" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Resolved (1)</text>
  <rect x="70" y="420" width="375" height="18" rx="4" fill="#f1f5f9"/>
  <rect x="70" y="420" width="62" height="18" rx="4" fill="#10b981"/>

  <text x="70" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Closed (1)</text>
  <rect x="70" y="475" width="375" height="18" rx="4" fill="#f1f5f9"/>
  <rect x="70" y="475" width="62" height="18" rx="4" fill="#64748b"/>

  <!-- Right: Centre Distribution -->
  <rect x="495" y="235" width="415" height="305" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="515" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tickets per Service Centre</text>
  <rect x="515" y="285" width="375" height="30" rx="4" fill="#f8fafc"/>
  <text x="525" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Mumbai Central Care</text>
  <text x="850" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1</text>

  <rect x="515" y="325" width="375" height="30" rx="4" fill="#f8fafc"/>
  <text x="525" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Pune Deccan Repair Hub</text>
  <text x="850" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1</text>

  <rect x="515" y="365" width="375" height="30" rx="4" fill="#f8fafc"/>
  <text x="525" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Bengaluru Koramangala Care</text>
  <text x="850" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1</text>

  <rect x="515" y="405" width="375" height="30" rx="4" fill="#f8fafc"/>
  <text x="525" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Delhi Connaught Plaza</text>
  <text x="850" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">0</text>
</svg>
